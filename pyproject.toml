[project]
name = "errand-agent"
version = "0.1.0"
description = "Chat agent for home-service errands with code-enforced approvals, idempotent booking and traced evals"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=7", "reportlab>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["errand_agent", "errand_agent.mocks", "errand_agent.llm"]
